version: '3.8'

services:
  # ---------- Infrastructure (adapters) ----------
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  neo4j:
    image: neo4j:5.15
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-nexus_password}
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-nexus_password}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.0
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]

  # ---------- NEXUS - Conscious Engine (Cortex) ----------
  nexus-cortex:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn nexus.infrastructure.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment: &nexus_env
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NEXUS_LLM_MODEL: ${NEXUS_LLM_MODEL:-gpt-4o}
      NEXUS_STT_MODEL: ${NEXUS_STT_MODEL:-whisper-1}
      NEXUS_TTS_MODEL: ${NEXUS_TTS_MODEL:-tts-1}
      NEXUS_TTS_VOICE: ${NEXUS_TTS_VOICE:-alloy}
      NEXUS_CORS_ORIGINS: ${NEXUS_CORS_ORIGINS:-http://localhost:3000}
      NEXUS_API_KEYS: ${NEXUS_API_KEYS:-{}}
      NEXUS_TENANTS: ${NEXUS_TENANTS:-}
      NEXUS_CHAT_RATE_LIMIT: ${NEXUS_CHAT_RATE_LIMIT:-60}
      NEXUS_TOOL_GEN_RATE_LIMIT: ${NEXUS_TOOL_GEN_RATE_LIMIT:-20}
      NEXUS_RATE_LIMIT_WINDOW_SECONDS: ${NEXUS_RATE_LIMIT_WINDOW_SECONDS:-60}
      NEXUS_JSON_LOGS: ${NEXUS_JSON_LOGS:-true}
      NEXUS_AUTONOMY_HOURLY_BUDGET: ${NEXUS_AUTONOMY_HOURLY_BUDGET:-0}
      NEXUS_AUTONOMY_DEFAULT_BUDGET: ${NEXUS_AUTONOMY_DEFAULT_BUDGET:-20}
      NEXUS_AUTONOMY_ALLOWLIST: ${NEXUS_AUTONOMY_ALLOWLIST:-tool_selfheal}
      NEXUS_GOALS_MAX_ACTIVE: ${NEXUS_GOALS_MAX_ACTIVE:-10}
      NEXUS_SWARM_MAX_WORKERS: ${NEXUS_SWARM_MAX_WORKERS:-5}
      NEXUS_DEPLOY_PLATFORM: ${NEXUS_DEPLOY_PLATFORM:-local}
      NEXUS_SECRET_BACKEND: ${NEXUS_SECRET_BACKEND:-env}
      RAILWAY_TOKEN: ${RAILWAY_TOKEN:-}
      RAILWAY_PROJECT_ID: ${RAILWAY_PROJECT_ID:-}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
      REDIS_HOST: redis
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nexus_password}
      QDRANT_HOST: qdrant
      QDRANT_SHARD_NUMBER: ${QDRANT_SHARD_NUMBER:-1}
      QDRANT_REPLICATION_FACTOR: ${QDRANT_REPLICATION_FACTOR:-1}
      CELERY_BROKER: redis://redis:6379/1
      CELERY_BACKEND: redis://redis:6379/2
    depends_on:
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      qdrant: { condition: service_started }

  # ---------- NEXUS - Subconscious Engine (Subcortex workers) ----------
  nexus-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A nexus.infrastructure.workers.celery_app:celery_app worker -Q nexus --loglevel=info
    environment: *nexus_env
    depends_on:
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      qdrant: { condition: service_started }

  # Dreaming scheduler (3 AM cron)
  nexus-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A nexus.infrastructure.workers.celery_app:celery_app beat --loglevel=info
    environment: *nexus_env
    depends_on:
      - redis

volumes:
  redis_data:
  neo4j_data:
  qdrant_data:
