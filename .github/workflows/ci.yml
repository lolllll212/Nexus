name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: black --check src/ tests/
      - run: mypy src/nexus/domain/ src/nexus/application/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: docker pull python:3.13-slim
      - run: pytest tests/ -q --tb=short

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run lint
        working-directory: web

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install import-linter
      - name: Check dependency rules (domain and application must not import infrastructure)
        run: lint-imports --config ../.github/workflows/importlinter.toml
        working-directory: src

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependency vulnerability scan (pip-audit)
        # Advisory for now: surfaces known CVEs in the runtime lock without
        # failing the build. Remove `continue-on-error` to make it a hard gate
        # once existing findings are triaged.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Static security scan (bandit)
        continue-on-error: true
        run: |
          pip install bandit
          bandit -q -ll -r src/nexus

