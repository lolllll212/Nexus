name: Nightly Eval

# Runs the golden-set ReAct eval against a real LLM and fails the job if the
# pass rate regresses below the threshold.
#
# Configure the model via repository secrets:
#   NEXUS_EVAL_BASE_URL   e.g. https://api.openai.com/v1 or an LM Studio/other endpoint
#   NEXUS_EVAL_MODEL      e.g. qwen2.5-coder-7b-instruct
#   NEXUS_EVAL_API_KEY    the key (local servers accept any value)

on:
  schedule:
    - cron: "17 3 * * *" # 3:17 AM UTC nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      NEXUS_EVAL_BASE_URL: ${{ secrets.NEXUS_EVAL_BASE_URL }}
      NEXUS_EVAL_MODEL: ${{ secrets.NEXUS_EVAL_MODEL }}
      NEXUS_EVAL_API_KEY: ${{ secrets.NEXUS_EVAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run golden-set eval
        run: python -m nexus.eval --output eval-reports --min-pass-rate 0.5

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-reports
          retention-days: 30