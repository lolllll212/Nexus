# NEXUS project configuration
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "A new kind of AI brain - dual-loop architecture with subconscious synthesis, dreaming, and self-evolution."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "NEXUS" }]

dependencies = [
    # API (conscious engine)
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",  # UploadFile/Form routes (/api/analyze) fail at import without it

    # Persistence adapters
    "redis>=5.0",
    "neo4j>=5.15",
    "qdrant-client>=1.9",

    # LLM adapters
    "openai>=1.12",

    # Background workers (subconscious)
    "celery>=5.3",

    # Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.2",
    "mypy>=1.8",
    "mkdocs-material>=9.5",
]

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 110

[tool.ruff]
line-length = 110
target-version = "py311"
