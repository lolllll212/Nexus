version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Storage & Infrastructure (Adapters)
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    ports: ["6379:6379"]
    volumes: [redis_prod_data:/data]
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy noeviction
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  neo4j:
    image: neo4j:5.15
    restart: always
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-nexus_production_secret_key}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 2G
      NEO4J_dbms_memory_heap_max__size: 4G
      NEO4J_dbms_memory_pagecache_size: 2G
    volumes: [neo4j_prod_data:/data]
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-nexus_production_secret_key}", "RETURN 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.0
    restart: always
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_prod_data:/qdrant/storage]
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # NEXUS Cortex (Conscious Engine + J.A.R.V.I.S. Production UI)
  # ─────────────────────────────────────────────────────────────────────────────
  nexus-cortex:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    stop_grace_period: 30s
    command: uvicorn nexus.infrastructure.api.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips='*'
    ports: ["8000:8000"]
    environment: &nexus_prod_env
      NEXUS_INFRA_BACKEND: ${NEXUS_INFRA_BACKEND:-external}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NEXUS_LLM_PROVIDER: ${NEXUS_LLM_PROVIDER:-nvidia}
      NEXUS_NIM_MODEL: ${NEXUS_NIM_MODEL:-meta/llama-3.3-70b-instruct}
      NEXUS_NIM_BASE_URL: ${NEXUS_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GMAIL_TOKEN: ${GMAIL_TOKEN:-}
      NEXUS_LLM_MODEL: ${NEXUS_LLM_MODEL:-gpt-4o}
      NEXUS_EMBEDDING_MODEL: ${NEXUS_EMBEDDING_MODEL:-text-embedding-3-large}
      NEXUS_EMBEDDING_DIMENSION: ${NEXUS_EMBEDDING_DIMENSION:-1536}
      NEXUS_CORS_ORIGINS: ${NEXUS_CORS_ORIGINS:-*}
      NEXUS_JSON_LOGS: "true"
      NEXUS_RATE_LIMIT_FAIL_CLOSED: "true"
      REDIS_HOST: redis
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nexus_production_secret_key}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      CELERY_BROKER: redis://redis:6379/1
      CELERY_BACKEND: redis://redis:6379/2
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      qdrant: { condition: service_healthy }

  # ─────────────────────────────────────────────────────────────────────────────
  # NEXUS Subcortex Workers (Deep Research, Synthesis, Tool Self-Healing)
  # ─────────────────────────────────────────────────────────────────────────────
  nexus-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    stop_grace_period: 60s
    command: celery -A nexus.infrastructure.workers.celery_app:celery_app worker -Q nexus --concurrency=4 --loglevel=info
    environment: *nexus_prod_env
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    depends_on:
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      qdrant: { condition: service_healthy }

  # ─────────────────────────────────────────────────────────────────────────────
  # Dreaming Scheduler (Nightly Memory Consolidation at 03:00 UTC)
  # ─────────────────────────────────────────────────────────────────────────────
  nexus-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: celery -A nexus.infrastructure.workers.celery_app:celery_app beat --loglevel=info
    environment: *nexus_prod_env
    depends_on:
      redis: { condition: service_healthy }

  # ─────────────────────────────────────────────────────────────────────────────
  # Observability & Metrics (Prometheus)
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.1
    restart: always
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_prod_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    depends_on:
      - nexus-cortex

volumes:
  redis_prod_data:
  neo4j_prod_data:
  qdrant_prod_data:
  prometheus_prod_data:
